# GitHub Actions workflow to build Node.js -> Wasix/WASM using Docker
name: Build Node.js (wasm32-wasi / wasix) with Docker

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Node.js -> wasm32-wasi
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      WASI_SDK_VERSION: "28"
      ARTIFACT_DIR: out
      DOCKER_IMAGE_NAME: node-wasix-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Docker image
        run: docker build -t $DOCKER_IMAGE_NAME -f Dockerfile.build .

      - name: Run wasm build in Docker container
        run: |
          docker run --rm -v "$(pwd):/work" -w /work \\
            -e WASI_SDK_VERSION=$WASI_SDK_VERSION \\
            -e ARTIFACT_DIR=$ARTIFACT_DIR \\
            $DOCKER_IMAGE_NAME \\
            /bin/bash -c "
              set -euxo pipefail

              # Download and install WASI SDK
              ver=\\"25.0\\"
              tarball=\\"wasi-sdk-${ver}-x86_64-linux.tar.gz\\"
              url=\\"https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-25/${tarball}\\"
              wget -q \\"$url\\"
              tar xzf \\"$tarball\\"
              sdk_dir=\\"wasi-sdk-${ver}\\"

              # Set up environment
              export WASI_SDK_PATH=\\"$PWD/$sdk_dir\\"
              export PATH=\\"$WASI_SDK_PATH/bin:\\$PATH\\"

              # Set up compilers
              export CC=\\"clang --target=wasm32-wasi --sysroot=$WASI_SDK_PATH/share/wasi-sysroot\\"
              export CXX=\\"clang++ --target=wasm32-wasi --sysroot=$WASI_SDK_PATH/share/wasi-sysroot\\"
              export AR=\\"llvm-ar\\"
              export RANLIB=\\"llvm-ranlib\\"

              # Make scripts executable
              chmod +x ./.github/scripts/build-node-wasix.sh || true

              # Run build script
              ./.github/scripts/build-node-wasix.sh
            "

      - name: Upload wasm build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: node-wasix-artifacts
          path: |
            out/**
            build/**

      - name: Print artifact tree
        if: always()
        run: |
          echo "Artifact directory listing:"
          ls -la out || true
          find out -maxdepth 3 -type f -print || true
