name: Build Node WASIX on Ubuntu
on:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-wasix:
    runs-on: ubuntu-latest
    # container:
    #   image: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install wasixcc
        shell: bash
        run: |
          set -euxo pipefail
          .github/scripts/install-wasixcc.sh
      - name: Download LLVM, binaryen and WASIX components
        shell: bash
        run: |
          set -euxo pipefail
          # Configure wasixcc download paths
          # export WASIXCC_SYSROOT_PREFIX="$PWD"
          # export WASIXCC_LLVM_LOCATION="$PWD/.wasix"
          # Download latest LLVM toolchain and WASIX sysroot
          wasixcc --download-all

      - name: Build node.wasm
        timeout-minutes: 10
        shell: bash
        run: |
          set -euxo pipefail
          export CFLAGS="-D_GNU_SOURCE"
          export CXXFLAGS="-D_GNU_SOURCE"
          make node.wasm JOBS=$(nproc)
      - name: Upload artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: node-wasix
          path: node.wasm
          retention-days: 30
