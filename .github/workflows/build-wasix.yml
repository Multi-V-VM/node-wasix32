name: Build Node WASIX
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build-wasix:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential python3 wget ca-certificates jq curl pkg-config binaryen file libssl-dev
      - name: Configure OpenSSL env
        run: |
          ARCH=$(dpkg-architecture -qDEB_HOST_MULTIARCH)
          echo "PKG_CONFIG_PATH=/usr/lib/${ARCH}/pkgconfig:/usr/lib/pkgconfig" >> $GITHUB_ENV
          echo "OPENSSL_DIR=/usr" >> $GITHUB_ENV
          echo "OPENSSL_LIB_DIR=/usr/lib/${ARCH}" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=/usr/include" >> $GITHUB_ENV
      - name: Install Rust toolchain
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          . $HOME/.cargo/env
          rustup toolchain install stable
      - name: Install wasixcc
        run: |
          . $HOME/.cargo/env
          cargo install wasixcc -F bin
          wasixcc --install-executables /usr/local/bin
          echo "PATH=/usr/local/bin:$HOME/.cargo/bin:$PATH" >> $GITHUB_ENV
      - name: Download and install Wasix sysroot
        shell: bash
        run: |
          set -euxo pipefail
          version="v2025-11-06.1"
          tarball="sysroot-eh.tar.gz"
          url="https://github.com/wasix-org/wasix-libc/releases/download/${version}/${tarball}"
          wget -q "$url"
          mkdir -p wasix-sysroot
          tar xzf "$tarball" -C wasix-sysroot
          echo "WASIX_SYSROOT_PATH=$PWD/wasix-sysroot" >> $GITHUB_ENV
          ls -la wasix-sysroot
      - name: Download and install LLVM
        shell: bash
        run: |
          set -euxo pipefail
          latest_release=$(curl -s https://api.github.com/repos/wasix-org/llvm-project/releases/latest | jq -r .tag_name)
          tarball="llvm-${latest_release}-x86_64-linux-gnu.tar.gz"
          url="https://github.com/wasix-org/llvm-project/releases/download/${latest_release}/${tarball}"
          wget -q "$url"
          mkdir -p llvm
          tar xzf "$tarball" -C llvm --strip-components=1
          echo "PATH=$PWD/llvm/bin:$PATH" >> $GITHUB_ENV
      - name: Build node.wasm
        run: |
          . $HOME/.cargo/env
          make node.wasm WASIX_SYSROOT_PATH="$WASIX_SYSROOT_PATH" JOBS=$(nproc)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-wasix
          path: node.wasm