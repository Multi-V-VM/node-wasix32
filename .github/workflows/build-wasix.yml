name: Build Node WASIX
on:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-wasix:
    runs-on: ubuntu-latest
    # container:
    #   image: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Configure OpenSSL env
        shell: bash
        run: |
          set -euxo pipefail
          ARCH=$(dpkg-architecture -qDEB_HOST_MULTIARCH)
          echo "PKG_CONFIG_PATH=/usr/lib/${ARCH}/pkgconfig:/usr/lib/pkgconfig" >> $GITHUB_ENV
          echo "OPENSSL_DIR=/usr" >> $GITHUB_ENV
          echo "OPENSSL_LIB_DIR=/usr/lib/${ARCH}" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=/usr/include" >> $GITHUB_ENV
      - name: Clone wasixcc
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/wasix-org/wasixcc.git
      - uses: actions/cache@v4
        with:
          path: wasixcc/target
          key: wasixcc-${{ runner.os }}-${{ hashFiles('wasixcc/Cargo.lock') }}
      - name: Build wasixcc
        shell: bash
        run: |
          set -euxo pipefail
          cd wasixcc
          git apply ../wasixcc.patch
          cargo build --release --features tracing-subscriber
          cp target/release/wasixcc /usr/local/bin/
          echo "PATH=/usr/local/bin:$PATH" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: wasix-sysroot
          key: sysroot-${{ runner.os }}-v2025-11-06.1
      - name: Download and install Wasix sysroot
        timeout-minutes: 10
        shell: bash
        run: |
          set -euxo pipefail
          version="v2025-11-06.1"
          tarball="sysroot-eh.tar.gz"
          expected_sha256=$(curl -s https://api.github.com/repos/wasix-org/wasix-libc/releases/tags/${version} | jq -r '.assets[] | select(.name == "sysroot-eh.tar.gz") | .digest' | sed 's/^sha256://')
          url="https://github.com/wasix-org/wasix-libc/releases/download/${version}/${tarball}"
          wget --tries=3 -q "$url"
          sha256sum --check <<<"${expected_sha256} $tarball"
          mkdir -p wasix-sysroot
          tar xzf "$tarball" -C wasix-sysroot
          echo "WASIX_SYSROOT_PATH=$PWD/wasix-sysroot" >> $GITHUB_ENV
          ls -la wasix-sysroot
      - name: Get LLVM release info
        shell: bash
        run: |
          set -euxo pipefail
          latest_release=$(curl -s https://api.github.com/repos/wasix-org/llvm-project/releases/latest | jq -r .tag_name)
          sha256_url=$(curl -s https://api.github.com/repos/wasix-org/llvm-project/releases/latest | jq -r '.assets[] | select(.name == "LLVM-Linux-x86_64.tar.gz.sha256") | .browser_download_url')
          expected_sha256=$(curl -s "$sha256_url")
          echo "LATEST_LLVM_RELEASE=$latest_release" >> $GITHUB_ENV
          echo "EXPECTED_SHA256_LLVM=$expected_sha256" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: llvm
          key: llvm-${{ runner.os }}-${{ env.LATEST_LLVM_RELEASE }}
      - name: Download and install LLVM
        timeout-minutes: 10
        shell: bash
        run: |
          set -euxo pipefail
          tarball="LLVM-Linux-x86_64.tar.gz"
          url="https://github.com/wasix-org/llvm-project/releases/download/${LATEST_LLVM_RELEASE}/${tarball}"
          wget --tries=3 -q "$url"
          sha256sum --check <<<"${EXPECTED_SHA256_LLVM} $tarball"
          mkdir -p llvm
          tar xzf "$tarball" -C llvm --strip-components=1
          echo "PATH=$PWD/llvm/bin:$PATH" >> $GITHUB_ENV
      - name: Build node.wasm
        timeout-minutes: 10
        shell: bash
        run: |
          set -euxo pipefail
          make node.wasm WASIX_SYSROOT_PATH="$WASIX_SYSROOT_PATH" JOBS=$(nproc)
      - name: Upload artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: node-wasix
          path: node.wasm
          retention-days: 30
