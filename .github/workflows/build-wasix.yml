name: Build Node WASIX on Ubuntu
on:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-wasix:
    runs-on: ubuntu-latest
    # container:
    #   image: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Configure OpenSSL env
        shell: bash
        run: |
          set -euxo pipefail
          ARCH=$(dpkg-architecture -qDEB_HOST_MULTIARCH)
          echo "PKG_CONFIG_PATH=/usr/lib/${ARCH}/pkgconfig:/usr/lib/pkgconfig" >> $GITHUB_ENV
          echo "OPENSSL_DIR=/usr" >> $GITHUB_ENV
          echo "OPENSSL_LIB_DIR=/usr/lib/${ARCH}" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=/usr/include" >> $GITHUB_ENV
      - uses: cargo-bins/cargo-binstall@main
      - name: Install wasixcc
        shell: bash
        run: |
          set -euxo pipefail
          # Install wasixcc using cargo binstall
          cargo binstall --force wasixcc
      - name: Download LLVM, binaryen and WASIX components
        shell: bash
        run: |
          set -euxo pipefail
          # Configure wasixcc download paths
          # export WASIXCC_SYSROOT_PREFIX="$PWD"
          # export WASIXCC_LLVM_LOCATION="$PWD/.wasix"
          # Download latest LLVM toolchain and WASIX sysroot
          $HOME/.cargo/bin/wasixcc --download-all
          sudo $HOME/.cargo/bin/wasixcc --install-executables /usr/local/bin

      - name: Build node.wasm
        timeout-minutes: 10
        shell: bash
        run: |
          set -euxo pipefail
          export CFLAGS="-D_GNU_SOURCE"
          export CXXFLAGS="-D_GNU_SOURCE"
          make node.wasm JOBS=$(nproc)
      - name: Upload artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: node-wasix
          path: node.wasm
          retention-days: 30
