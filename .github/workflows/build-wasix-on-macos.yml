name: Build Node WASIX on MacOS
on:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-wasix:
    runs-on: macos-26
    # container:
    #   image: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Configure OpenSSL env
        shell: bash
        run: |
          set -euxo pipefail
          # Use Homebrew OpenSSL if available, otherwise fall back to system
          if [ -d "/usr/local/opt/openssl" ]; then
            OPENSSL_PREFIX="/usr/local/opt/openssl"
          elif [ -d "/opt/homebrew/opt/openssl" ]; then
            OPENSSL_PREFIX="/opt/homebrew/opt/openssl"
          else
            OPENSSL_PREFIX="/usr"
          fi
          
          echo "PKG_CONFIG_PATH=${OPENSSL_PREFIX}/lib/pkgconfig:/usr/lib/pkgconfig" >> $GITHUB_ENV
          echo "OPENSSL_DIR=${OPENSSL_PREFIX}" >> $GITHUB_ENV
          echo "OPENSSL_LIB_DIR=${OPENSSL_PREFIX}/lib" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=${OPENSSL_PREFIX}/include" >> $GITHUB_ENV
      - uses: cargo-bins/cargo-binstall@main
      - name: Install wasixcc
        shell: bash
        run: |
          set -euxo pipefail
          # Install wasixcc using cargo binstall
          cargo binstall wasixcc
          # Add cargo bin to PATH
          echo "PATH=$HOME/.cargo/bin:$PATH" >> $GITHUB_ENV
      - name: Download LLVM, binaryen and WASIX components
        shell: bash
        run: |
          set -euxo pipefail
          # Configure wasixcc download paths
          # export WASIXCC_SYSROOT_PREFIX="$PWD"
          # export WASIXCC_LLVM_LOCATION="$PWD/.wasix"
          # Download latest LLVM toolchain and WASIX sysroot
          wasixcc --download-all
          sudo wasixcc --install-executables /usr/local/bin

      - name: Build node.wasm
        timeout-minutes: 10
        shell: bash
        run: |
          set -euxo pipefail
          export CFLAGS="-D_GNU_SOURCE"
          export CXXFLAGS="-D_GNU_SOURCE"
          make node.wasm JOBS=$(nproc)
      - name: Upload artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: node-wasix
          path: node.wasm
          retention-days: 30
